<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UPS Fleet Monitor — Industrial IoT Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/ractive/1.4.4/ractive.min.js"></script>

<style>
/* ---------------------------------------------------------------
   UPS Fleet Monitor — tokens
   --------------------------------------------------------------- */
:root {
	--bg:            #0e1218;
	--panel:         #171d26;
	--panel-raised:  #1c232e;
	--line:          #262f3b;
	--text:          #e6ebf1;
	--text-muted:    #8a96a6;
	--text-faint:    #5b6675;

	--ok:            #35c4a1;
	--ok-dim:        #1f4f45;
	--warn:          #e6a23c;
	--warn-dim:      #4f3d1c;
	--crit:          #e5534b;
	--crit-dim:      #4c211e;
	--info:          #4f8cff;
	--info-dim:      #1f3357;

	--font-sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
	--font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;

	--radius: 3px;
	--gap: 18px;
}

* { box-sizing: border-box; }

html, body {
	background: var(--bg);
	color: var(--text);
	margin: 0;
	font-family: var(--font-sans);
	-webkit-font-smoothing: antialiased;
}

body {
	background-image:
		linear-gradient(var(--line) 1px, transparent 1px),
		linear-gradient(90deg, var(--line) 1px, transparent 1px);
	background-size: 48px 48px;
	background-attachment: fixed;
	background-color: var(--bg);
}

button { font-family: inherit; }

/* ---------------------------------------------------------------
   Shell / layout
   --------------------------------------------------------------- */
.dash {
	max-width: 1240px;
	margin: 0 auto;
	padding: 28px 24px 60px;
}

.dash__header {
	display: flex;
	align-items: flex-end;
	justify-content: space-between;
	gap: var(--gap);
	padding-bottom: 18px;
	border-bottom: 1px solid var(--line);
	margin-bottom: 20px;
}

.dash__brand {
	display: flex;
	align-items: center;
	gap: 14px;
}

.dash__brand-mark {
	font-size: 30px;
	color: var(--ok);
	line-height: 1;
}

.dash__brand h1 {
	margin: 0;
	font-size: 20px;
	font-weight: 600;
	letter-spacing: 0.2px;
}

.dash__brand-sub {
	margin: 3px 0 0;
	font-size: 12.5px;
	color: var(--text-muted);
}

.dash__clock {
	font-family: var(--font-mono);
	font-size: 13px;
	color: var(--text-muted);
	padding-bottom: 3px;
}

.dash__footer {
	margin-top: 36px;
	text-align: center;
	font-size: 11.5px;
	color: var(--text-faint);
}

/* ---------------------------------------------------------------
   Fleet tabs
   --------------------------------------------------------------- */
.fleet-tabs {
	display: flex;
	gap: 10px;
	margin-bottom: var(--gap);
	flex-wrap: wrap;
}

.fleet-tab {
	display: flex;
	align-items: center;
	gap: 10px;
	background: var(--panel);
	border: 1px solid var(--line);
	border-radius: var(--radius);
	padding: 10px 16px;
	cursor: pointer;
	color: var(--text-muted);
	text-align: left;
	transition: border-color 0.15s ease, color 0.15s ease;
}

.fleet-tab:hover {
	border-color: #37414f;
	color: var(--text);
}

.fleet-tab.is-active {
	border-color: var(--ok);
	color: var(--text);
	background: var(--panel-raised);
}

.fleet-tab:focus-visible {
	outline: 2px solid var(--info);
	outline-offset: 2px;
}

.fleet-tab__text {
	display: flex;
	flex-direction: column;
	line-height: 1.3;
}

.fleet-tab__name {
	font-size: 13.5px;
	font-weight: 600;
	color: var(--text);
}

.fleet-tab__meta {
	font-size: 11px;
	color: var(--text-faint);
	font-family: var(--font-mono);
}

.fleet-tab__dot,
.status-dot-online,
.status-dot-battery,
.status-dot-bypass {
	width: 8px;
	height: 8px;
	border-radius: 50%;
	flex-shrink: 0;
}

.status-dot-online   { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.status-dot-battery  { background: var(--crit); box-shadow: 0 0 6px var(--crit); animation: pulse 1.4s ease-in-out infinite; }
.status-dot-bypass   { background: var(--warn); box-shadow: 0 0 6px var(--warn); }

/* ---------------------------------------------------------------
   Hero
   --------------------------------------------------------------- */
.hero {
	display: grid;
	grid-template-columns: 1.4fr 1fr auto;
	gap: var(--gap);
	background: var(--panel);
	border: 1px solid var(--line);
	border-left: 4px solid var(--ok);
	border-radius: var(--radius);
	padding: 24px 26px;
	margin-bottom: var(--gap);
}

.hero.status-battery { border-left-color: var(--crit); }
.hero.status-bypass  { border-left-color: var(--warn); }

.hero__mode-flag {
	display: inline-block;
	font-size: 11px;
	font-weight: 600;
	letter-spacing: 0.4px;
	color: var(--ok);
	background: var(--ok-dim);
	border-radius: var(--radius);
	padding: 3px 9px;
	margin-bottom: 10px;
}

.hero.status-battery .hero__mode-flag { color: var(--crit); background: var(--crit-dim); }
.hero.status-bypass  .hero__mode-flag { color: var(--warn); background: var(--warn-dim); }

.hero__mode h2 {
	margin: 0 0 4px;
	font-size: 22px;
	font-weight: 600;
}

.hero__mode h2 small {
	font-size: 13px;
	font-weight: 400;
	color: var(--text-muted);
	margin-left: 8px;
}

.hero__loc {
	margin: 0 0 18px;
	font-size: 13px;
	color: var(--text-muted);
}

.hero__actions {
	display: flex;
	align-items: center;
	gap: 16px;
	flex-wrap: wrap;
}

.btn {
	background: transparent;
	border: 1px solid #3a4453;
	color: var(--text);
	border-radius: var(--radius);
	padding: 9px 16px;
	font-size: 13px;
	cursor: pointer;
	transition: border-color 0.15s ease, background 0.15s ease;
}

.btn:hover { border-color: var(--info); background: var(--info-dim); }
.btn:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }

.unit-toggle {
	font-size: 12.5px;
	color: var(--text-muted);
	display: flex;
	align-items: center;
	gap: 6px;
	cursor: pointer;
}

.hero__metric {
	display: flex;
	flex-direction: column;
	justify-content: center;
	border-left: 1px solid var(--line);
	padding-left: var(--gap);
}

.hero__metric-value {
	font-family: var(--font-mono);
	font-size: 40px;
	font-weight: 500;
	line-height: 1;
}

.hero__metric-value small {
	font-size: 15px;
	color: var(--text-muted);
	margin-left: 4px;
}

.hero__metric-label {
	font-size: 12px;
	color: var(--text-muted);
	margin: 8px 0 10px;
}

.hero__metric-flag {
	align-self: flex-start;
	font-size: 11px;
	font-weight: 600;
	border-radius: var(--radius);
	padding: 3px 9px;
}

.flag-ok       { color: var(--ok);   background: var(--ok-dim); }
.flag-warning  { color: var(--warn); background: var(--warn-dim); }
.flag-critical { color: var(--crit); background: var(--crit-dim); }

.hero__health {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	position: relative;
	width: 130px;
}

.health-ring {
	width: 110px;
	height: 110px;
	transform: rotate(-90deg);
}

.health-ring__track {
	fill: none;
	stroke: var(--line);
	stroke-width: 8;
}

.health-ring__value {
	fill: none;
	stroke: var(--ok);
	stroke-width: 8;
	stroke-linecap: round;
	transition: stroke-dashoffset 0.6s ease;
}

.status-battery .health-ring__value { stroke: var(--crit); }
.status-bypass  .health-ring__value { stroke: var(--warn); }

.health-ring__label {
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
	display: flex;
	flex-direction: column;
	align-items: center;
	line-height: 1.1;
}

.health-ring__label strong {
	font-family: var(--font-mono);
	font-size: 26px;
}

.health-ring__label span {
	font-size: 10px;
	color: var(--text-muted);
	text-transform: lowercase;
}

/* ---------------------------------------------------------------
   Panel grid
   --------------------------------------------------------------- */
.grid {
	display: grid;
	grid-template-columns: repeat(3, 1fr);
	gap: var(--gap);
}

.panel--wide { grid-column: span 3; }

.panel {
	background: var(--panel);
	border: 1px solid var(--line);
	border-radius: var(--radius);
	display: flex;
	flex-direction: column;
	min-width: 0;
}

.panel__head {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	padding: 14px 18px;
	border-bottom: 1px solid var(--line);
}

.panel__head h3 {
	margin: 0;
	font-size: 13px;
	font-weight: 600;
	letter-spacing: 0.2px;
}

.panel__tag {
	font-family: var(--font-mono);
	font-size: 11.5px;
	color: var(--text-muted);
}

.panel__body {
	padding: 16px 18px 20px;
	flex: 1;
}

.stat-row {
	display: grid;
	grid-template-columns: repeat(2, 1fr);
	gap: 14px 16px;
}

.stat-grid {
	display: grid;
	grid-template-columns: repeat(2, 1fr);
	gap: 16px 18px;
}

.stat {
	display: flex;
	flex-direction: column;
	gap: 4px;
}

.stat__label {
	font-size: 11px;
	color: var(--text-muted);
}

.stat__value {
	font-family: var(--font-mono);
	font-size: 15px;
}

.stat__value--warn { color: var(--warn); }

.tag-normal, .tag-good, .tag-ready   { color: var(--ok); }
.tag-warning, .tag-moderate, .tag-standby { color: var(--warn); }
.tag-critical, .tag-poor, .tag-fault { color: var(--crit); }

/* battery capacity sparkline */
.capacity {
	margin-top: 18px;
	padding-top: 16px;
	border-top: 1px solid var(--line);
}

.capacity__head {
	display: flex;
	justify-content: space-between;
	font-size: 12px;
	color: var(--text-muted);
	margin-bottom: 6px;
}

.capacity__head strong {
	color: var(--text);
	font-family: var(--font-mono);
}

.sparkline {
	width: 100%;
	height: 60px;
	display: block;
}

.sparkline polyline {
	fill: none;
	stroke: var(--ok);
	stroke-width: 2;
	vector-effect: non-scaling-stroke;
}

.sparkline--muted { height: 50px; margin: 12px 0; }
.sparkline--muted polyline { stroke: var(--info); }

.capacity__foot {
	margin-top: 10px;
	font-size: 11.5px;
	color: var(--text-muted);
}

.capacity__foot strong { color: var(--text); font-family: var(--font-mono); }

/* load bar */
.load-bar {
	height: 10px;
	background: #10151d;
	border: 1px solid var(--line);
	border-radius: 5px;
	overflow: hidden;
}

.load-bar__fill {
	height: 100%;
	background: var(--info);
	transition: width 0.6s ease;
}

.load-bar__fill.load-warning  { background: var(--warn); }
.load-bar__fill.load-critical { background: var(--crit); }

.load-bar__scale {
	display: flex;
	justify-content: space-between;
	font-size: 10px;
	color: var(--text-faint);
	margin-top: 5px;
}

/* mini gauge (capacitor health) */
.mini-gauge {
	margin-top: 18px;
	padding-top: 16px;
	border-top: 1px solid var(--line);
	display: grid;
	grid-template-columns: auto 1fr auto;
	align-items: center;
	gap: 10px;
}

.mini-gauge__label { font-size: 12px; color: var(--text-muted); }

.mini-gauge__track {
	height: 6px;
	background: #10151d;
	border-radius: 3px;
	overflow: hidden;
}

.mini-gauge__fill {
	height: 100%;
	background: var(--ok);
	transition: width 0.6s ease;
}

.mini-gauge__value {
	font-family: var(--font-mono);
	font-size: 12.5px;
}

/* predictive maintenance list */
.predict-list {
	list-style: none;
	margin: 0;
	padding: 0;
	display: flex;
	flex-direction: column;
	gap: 12px;
}

.predict-list li {
	display: grid;
	grid-template-columns: auto 1fr auto;
	align-items: center;
	gap: 10px;
	font-size: 12.5px;
}

.predict-list__dot {
	width: 8px;
	height: 8px;
	border-radius: 50%;
}

.risk-low    { background: var(--ok); }
.risk-medium { background: var(--warn); }
.risk-high   { background: var(--crit); }

.predict-list__label { color: var(--text); }
.predict-list__value {
	font-family: var(--font-mono);
	color: var(--text-muted);
	white-space: nowrap;
}

/* alarms */
.alarm-list {
	list-style: none;
	margin: 0;
	padding: 0;
	display: flex;
	flex-direction: column;
}

.alarm {
	display: grid;
	grid-template-columns: 90px 1fr 90px 140px;
	align-items: center;
	gap: 14px;
	padding: 11px 4px;
	border-bottom: 1px solid var(--line);
	font-size: 13px;
}

.alarm:last-child { border-bottom: none; }

.alarm__sev {
	font-family: var(--font-mono);
	font-size: 10.5px;
	text-transform: uppercase;
	letter-spacing: 0.5px;
	padding: 3px 8px;
	border-radius: var(--radius);
	width: fit-content;
}

.severity-info .alarm__sev     { color: var(--info); background: var(--info-dim); }
.severity-warning .alarm__sev  { color: var(--warn); background: var(--warn-dim); }
.severity-critical .alarm__sev { color: var(--crit); background: var(--crit-dim); }

.alarm__msg { color: var(--text); }
.alarm.is-ack .alarm__msg { color: var(--text-muted); }

.alarm__time {
	font-family: var(--font-mono);
	font-size: 11.5px;
	color: var(--text-faint);
}

.alarm__ack {
	justify-self: end;
	background: transparent;
	border: 1px solid #3a4453;
	color: var(--text-muted);
	border-radius: var(--radius);
	padding: 6px 10px;
	font-size: 11.5px;
	cursor: pointer;
}

.alarm__ack:hover { border-color: var(--info); color: var(--text); }

.alarm__acked {
	justify-self: end;
	font-size: 11px;
	color: var(--text-faint);
}

.alarm-empty {
	padding: 14px 4px;
	color: var(--text-faint);
	font-size: 12.5px;
}

/* ---------------------------------------------------------------
   Motion / accessibility
   --------------------------------------------------------------- */
@keyframes pulse {
	0%, 100% { opacity: 1; }
	50%      { opacity: 0.35; }
}

@media (prefers-reduced-motion: reduce) {
	.status-dot-battery { animation: none; }
	.health-ring__value, .load-bar__fill, .mini-gauge__fill { transition: none; }
}

/* ---------------------------------------------------------------
   Responsive
   --------------------------------------------------------------- */
@media (max-width: 980px) {
	.hero { grid-template-columns: 1fr; }
	.hero__metric { border-left: none; padding-left: 0; border-top: 1px solid var(--line); padding-top: 16px; }
	.hero__health { align-self: center; }
	.grid { grid-template-columns: repeat(2, 1fr); }
	.panel--wide { grid-column: span 2; }
}

@media (max-width: 640px) {
	.dash { padding: 20px 14px 40px; }
	.dash__header { flex-direction: column; align-items: flex-start; gap: 6px; }
	.grid { grid-template-columns: 1fr; }
	.panel--wide { grid-column: span 1; }
	.stat-row, .stat-grid { grid-template-columns: 1fr 1fr; }
	.alarm { grid-template-columns: 1fr; gap: 6px; }
	.alarm__ack, .alarm__acked { justify-self: start; }
}
</style>
</head>
<body>

<div id="app">Loading dashboard&hellip;</div>

<script id="dashboard-template" type="text/ractive">
<div class="dash">

	<header class="dash__header">
		<div class="dash__brand">
			<span class="dash__brand-mark">&#9211;</span>
			<div>
				<h1>UPS Fleet Monitor</h1>
				<p class="dash__brand-sub">Industrial IoT &middot; battery health &amp; power continuity</p>
			</div>
		</div>
		<div class="dash__clock">{{clockLabel}}</div>
	</header>

	<nav class="fleet-tabs">
		{{#each fleet:i}}
			<button
				class="fleet-tab {{i === activeIndex ? 'is-active' : ''}}"
				on-click="@this.selectUnit(i)"
			>
				<span class="fleet-tab__dot status-dot-{{mode}}"></span>
				<span class="fleet-tab__text">
					<span class="fleet-tab__name">{{name}}</span>
					<span class="fleet-tab__meta">{{location}}</span>
				</span>
			</button>
		{{/each}}
	</nav>

	<section class="hero status-{{unit.mode}}">

		<div class="hero__mode">
			<span class="hero__mode-flag">{{modeLabel(unit.mode)}}</span>
			<h2>{{unit.name}} <small>{{unit.type}}</small></h2>
			<p class="hero__loc">{{unit.location}}</p>
			<div class="hero__actions">
				<button class="btn" on-click="@this.simulateOutage()">
					{{unit.mode === 'online' ? 'Simulate utility loss' : 'Restore utility power'}}
				</button>
				<label class="unit-toggle">
					<input type="checkbox" checked="{{useFahrenheit}}" /> &deg;F
				</label>
			</div>
		</div>

		<div class="hero__metric">
			<span class="hero__metric-value">{{unit.runtime.estimateMinutes}}<small>min</small></span>
			<span class="hero__metric-label">Estimated runtime at current load</span>
			<span class="hero__metric-flag flag-{{runtimeStatus(unit)}}">{{runtimeStatusLabel(unit)}}</span>
		</div>

		<div class="hero__health">
			<svg viewBox="0 0 120 120" class="health-ring">
				<circle class="health-ring__track" cx="60" cy="60" r="52"></circle>
				<circle
					class="health-ring__value"
					cx="60" cy="60" r="52"
					stroke-dasharray="{{ringCircumference}} {{ringCircumference}}"
					stroke-dashoffset="{{ringOffset(unit.healthScore)}}"
				></circle>
			</svg>
			<div class="health-ring__label">
				<strong>{{unit.healthScore}}</strong>
				<span>health score</span>
			</div>
		</div>

	</section>

	<div class="grid">

		<section class="panel panel--battery">
			<header class="panel__head">
				<h3>Battery Health</h3>
				<span class="panel__tag">{{unit.battery.cellCount}} cells &middot; VRLA string</span>
			</header>
			<div class="panel__body">
				<div class="stat-row">
					<div class="stat">
						<span class="stat__label">String voltage</span>
						<span class="stat__value">{{unit.battery.stringVoltage}}V</span>
					</div>
					<div class="stat">
						<span class="stat__label">Impedance</span>
						<span class="stat__value {{unit.battery.impedance > unit.battery.impedanceBaseline * 1.15 ? 'stat__value--warn' : ''}}">
							{{unit.battery.impedance}} m&Omega;
						</span>
					</div>
					<div class="stat">
						<span class="stat__label">Temperature</span>
						<span class="stat__value">{{tempDisplay(unit.battery.temperature, useFahrenheit)}}</span>
					</div>
					<div class="stat">
						<span class="stat__label">Charge current</span>
						<span class="stat__value">{{unit.battery.chargeCurrent}} A</span>
					</div>
				</div>

				<div class="capacity">
					<div class="capacity__head">
						<span>Capacity trend</span>
						<strong>{{unit.battery.capacityPct}}%</strong>
					</div>
					<svg viewBox="0 0 240 60" class="sparkline" preserveAspectRatio="none">
						<polyline points="{{sparklinePoints(unit.battery.capacityHistory, 240, 60, 70, 100)}}"></polyline>
					</svg>
					<div class="capacity__foot">
						Predicted replacement window &middot; <strong>{{unit.battery.predictedReplacement}}</strong>
					</div>
				</div>
			</div>
		</section>

		<section class="panel panel--load">
			<header class="panel__head">
				<h3>Load &amp; Capacity</h3>
				<span class="panel__tag">{{unit.load.kw}} kW / {{unit.load.capacityKw}} kW</span>
			</header>
			<div class="panel__body">
				<div class="load-bar">
					<div class="load-bar__fill load-{{loadZone(unit.load.pct)}}" style="width: {{unit.load.pct}}%"></div>
				</div>
				<div class="load-bar__scale"><span>0%</span><span>50%</span><span>100%</span></div>

				<svg viewBox="0 0 240 50" class="sparkline sparkline--muted" preserveAspectRatio="none">
					<polyline points="{{sparklinePoints(unit.load.trendHistory, 240, 50, 0, 100)}}"></polyline>
				</svg>

				<div class="stat-row">
					<div class="stat">
						<span class="stat__label">Required runtime</span>
						<span class="stat__value">{{unit.runtime.requiredMinutes}} min</span>
					</div>
					<div class="stat">
						<span class="stat__label">Present load</span>
						<span class="stat__value">{{unit.load.pct}}%</span>
					</div>
				</div>
			</div>
		</section>

		<section class="panel panel--electronics">
			<header class="panel__head"><h3>Power Electronics</h3></header>
			<div class="panel__body">
				<div class="stat-row">
					<div class="stat">
						<span class="stat__label">Inverter output</span>
						<span class="stat__value">{{unit.electronics.inverterVoltage}}V / {{unit.electronics.inverterFrequency}}Hz</span>
					</div>
					<div class="stat">
						<span class="stat__label">Output THD</span>
						<span class="stat__value">{{unit.electronics.inverterThd}}%</span>
					</div>
					<div class="stat">
						<span class="stat__label">Rectifier / charger</span>
						<span class="stat__value tag-{{unit.electronics.rectifierStatus}}">{{statusLabel(unit.electronics.rectifierStatus)}}</span>
					</div>
					<div class="stat">
						<span class="stat__label">Cooling fans</span>
						<span class="stat__value tag-{{unit.electronics.fanStatus}}">{{statusLabel(unit.electronics.fanStatus)}}</span>
					</div>
				</div>

				<div class="mini-gauge">
					<span class="mini-gauge__label">Capacitor bank health</span>
					<div class="mini-gauge__track">
						<div class="mini-gauge__fill" style="width: {{unit.electronics.capacitorHealthPct}}%"></div>
					</div>
					<span class="mini-gauge__value">{{unit.electronics.capacitorHealthPct}}%</span>
				</div>
			</div>
		</section>

		<section class="panel panel--environment">
			<header class="panel__head"><h3>Environmental</h3></header>
			<div class="panel__body stat-grid">
				<div class="stat">
					<span class="stat__label">Ambient temperature</span>
					<span class="stat__value">{{tempDisplay(unit.environment.ambientTempC, useFahrenheit)}}</span>
				</div>
				<div class="stat">
					<span class="stat__label">Humidity</span>
					<span class="stat__value">{{unit.environment.humidityPct}}%</span>
				</div>
				<div class="stat">
					<span class="stat__label">Air quality</span>
					<span class="stat__value tag-{{unit.environment.airQuality}}">{{statusLabel(unit.environment.airQuality)}}</span>
				</div>
				<div class="stat">
					<span class="stat__label">Water detection</span>
					<span class="stat__value tag-{{unit.environment.waterDetected ? 'critical' : 'normal'}}">
						{{unit.environment.waterDetected ? 'Detected' : 'Dry'}}
					</span>
				</div>
			</div>
		</section>

		<section class="panel panel--transfer">
			<header class="panel__head"><h3>Transfer &amp; Bypass</h3></header>
			<div class="panel__body stat-grid">
				<div class="stat">
					<span class="stat__label">Transfer switch</span>
					<span class="stat__value tag-{{unit.transfer.switchStatus}}">{{statusLabel(unit.transfer.switchStatus)}}</span>
				</div>
				<div class="stat">
					<span class="stat__label">Maintenance bypass</span>
					<span class="stat__value tag-{{unit.transfer.bypassAvailable ? 'normal' : 'critical'}}">
						{{unit.transfer.bypassAvailable ? 'Available' : 'Unavailable'}}
					</span>
				</div>
				<div class="stat">
					<span class="stat__label">Last transfer time</span>
					<span class="stat__value">{{unit.transfer.lastTransferMs}} ms</span>
				</div>
				<div class="stat">
					<span class="stat__label">Last transfer event</span>
					<span class="stat__value">{{unit.transfer.lastTransferAt}}</span>
				</div>
			</div>
		</section>

		<section class="panel panel--predictive">
			<header class="panel__head"><h3>Predictive Maintenance</h3></header>
			<div class="panel__body">
				<ul class="predict-list">
					{{#each unit.predictions}}
						<li>
							<span class="predict-list__dot risk-{{risk}}"></span>
							<span class="predict-list__label">{{label}}</span>
							<span class="predict-list__value">{{value}}</span>
						</li>
					{{/each}}
				</ul>
			</div>
		</section>

		<section class="panel panel--alarms panel--wide">
			<header class="panel__head">
				<h3>Alarms &amp; Events</h3>
				<span class="panel__tag">{{unacknowledgedCount(unit)}} open</span>
			</header>
			<div class="panel__body">
				<ul class="alarm-list">
					{{#each unit.alarms}}
						<li class="alarm severity-{{severity}} {{ack ? 'is-ack' : ''}}">
							<span class="alarm__sev">{{severity}}</span>
							<span class="alarm__msg">{{message}}</span>
							<span class="alarm__time">{{time}}</span>
							{{^ack}}
								<button class="alarm__ack" on-click="@this.ackAlarm(@index)">Acknowledge</button>
							{{/ack}}
							{{#ack}}
								<span class="alarm__acked">Acknowledged</span>
							{{/ack}}
						</li>
					{{else}}
						<li class="alarm-empty">No alarms recorded for this unit.</li>
					{{/each}}
				</ul>
			</div>
		</section>

	</div>

	<footer class="dash__footer">Simulated telemetry for demonstration &middot; refreshes every few seconds</footer>

</div>
</script>

<script>
/* =================================================================
   UPS Fleet Monitor — Ractive component
   ================================================================= */

(function () {
	"use strict";

	/* ---------------------------------------------------------------
	   small numeric helpers
	   --------------------------------------------------------------- */
	function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
	function round1(v) { return Math.round(v * 10) / 10; }

	function genHistory(base, n, variance, lo, hi) {
		var arr = [];
		var v = base;
		for (var i = 0; i < n; i++) {
			v = clamp(v + (Math.random() - 0.5) * variance, lo, hi);
			arr.push(round1(v));
		}
		return arr;
	}

	/* ---------------------------------------------------------------
	   template helper functions (called directly from mustaches)
	   --------------------------------------------------------------- */
	function modeLabel(mode) {
		return { online: "On Utility Power", battery: "Running On Battery", bypass: "On Maintenance Bypass" }[mode] || mode;
	}

	function statusLabel(status) {
		var map = { normal: "Normal", warning: "Warning", critical: "Critical", fault: "Fault",
			good: "Good", moderate: "Moderate", poor: "Poor", ready: "Ready", standby: "Standby" };
		if (map[status]) return map[status];
		var s = String(status || "");
		return s.charAt(0).toUpperCase() + s.slice(1);
	}

	function runtimeStatus(unit) {
		var ratio = unit.runtime.estimateMinutes / unit.runtime.requiredMinutes;
		if (unit.mode === "battery" && ratio < 1) return "critical";
		if (ratio < 1.5) return "warning";
		return "ok";
	}

	function runtimeStatusLabel(unit) {
		var s = runtimeStatus(unit);
		return { ok: "Adequate margin", warning: "Monitor closely", critical: "Below requirement" }[s];
	}

	function loadZone(pct) {
		if (pct >= 90) return "critical";
		if (pct >= 75) return "warning";
		return "normal";
	}

	function tempDisplay(celsius, useFahrenheit) {
		if (useFahrenheit) return round1(celsius * 9 / 5 + 32) + "\u00B0F";
		return round1(celsius) + "\u00B0C";
	}

	function sparklinePoints(history, w, h, lo, hi) {
		if (!history || !history.length) return "";
		var min = typeof lo === "number" ? lo : Math.min.apply(null, history);
		var max = typeof hi === "number" ? hi : Math.max.apply(null, history);
		var range = (max - min) || 1;
		var step = history.length > 1 ? w / (history.length - 1) : 0;
		var pts = [];
		for (var i = 0; i < history.length; i++) {
			var x = round1(i * step);
			var y = round1(h - ((history[i] - min) / range) * h);
			pts.push(x + "," + y);
		}
		return pts.join(" ");
	}

	function ringOffset(score) {
		var c = 2 * Math.PI * 52;
		return round1(c - (c * clamp(score, 0, 100)) / 100);
	}

	function unacknowledgedCount(unit) {
		return unit.alarms.filter(function (a) { return !a.ack; }).length;
	}

	/* ---------------------------------------------------------------
	   seed data — a small fleet with three different UPS archetypes
	   --------------------------------------------------------------- */
	function buildFleet() {
		return [
			{
				id: "ups-1",
				name: "UPS-1",
				location: "Data Hall A \u00B7 Row 3",
				type: "Online (Double-Conversion)",
				mode: "online",
				healthScore: 92,
				battery: {
					stringVoltage: 480.2,
					cellCount: 40,
					impedance: 3.8,
					impedanceBaseline: 3.2,
					temperature: 26.4,
					chargeCurrent: 2.1,
					capacityPct: 94,
					capacityHistory: genHistory(94, 24, 1.2, 85, 100),
					predictedReplacement: "Mar 2028"
				},
				runtime: { estimateMinutes: 34, requiredMinutes: 15 },
				load: {
					pct: 58, kw: 46.4, capacityKw: 80,
					trendHistory: genHistory(58, 24, 3, 40, 75)
				},
				electronics: {
					inverterVoltage: 480.6, inverterFrequency: 60.01, inverterThd: 1.8,
					rectifierStatus: "normal", capacitorHealthPct: 88, fanStatus: "normal"
				},
				environment: { ambientTempC: 22.8, humidityPct: 41, airQuality: "good", waterDetected: false },
				transfer: { switchStatus: "ready", bypassAvailable: true, lastTransferMs: 4, lastTransferAt: "Aug 2, 2026" },
				predictions: [
					{ label: "Battery string replacement window", value: "18\u201322 months", risk: "low" },
					{ label: "Capacitor bank service", value: "\u224814 months", risk: "medium" },
					{ label: "Fan bearing wear", value: "Nominal", risk: "low" }
				],
				alarms: [
					{ severity: "info", message: "Scheduled discharge test completed", time: "08:12", ack: true },
					{ severity: "warning", message: "Battery impedance trending upward on string 2", time: "Yesterday", ack: false }
				]
			},
			{
				id: "ups-2",
				name: "UPS-2",
				location: "Telecom Room B \u00B7 Floor 2",
				type: "Line-Interactive",
				mode: "battery",
				healthScore: 61,
				battery: {
					stringVoltage: 238.5,
					cellCount: 20,
					impedance: 6.1,
					impedanceBaseline: 4.0,
					temperature: 31.2,
					chargeCurrent: 0,
					capacityPct: 71,
					capacityHistory: genHistory(78, 24, 1.6, 60, 90),
					predictedReplacement: "Nov 2026"
				},
				runtime: { estimateMinutes: 9, requiredMinutes: 12 },
				load: {
					pct: 82, kw: 16.4, capacityKw: 20,
					trendHistory: genHistory(80, 24, 4, 60, 95)
				},
				electronics: {
					inverterVoltage: 236.9, inverterFrequency: 59.94, inverterThd: 3.1,
					rectifierStatus: "fault", capacitorHealthPct: 64, fanStatus: "warning"
				},
				environment: { ambientTempC: 28.4, humidityPct: 55, airQuality: "moderate", waterDetected: false },
				transfer: { switchStatus: "fault", bypassAvailable: false, lastTransferMs: 11, lastTransferAt: "Just now" },
				predictions: [
					{ label: "Battery replacement (string 1)", value: "Due now", risk: "high" },
					{ label: "Charger inspection", value: "Recommended this week", risk: "medium" }
				],
				alarms: [
					{ severity: "critical", message: "Utility power lost \u2014 transferred to battery", time: "2 min ago", ack: false },
					{ severity: "critical", message: "Runtime estimate below required duration", time: "1 min ago", ack: false },
					{ severity: "warning", message: "Rectifier charger fault detected", time: "12 min ago", ack: false }
				]
			},
			{
				id: "ups-3",
				name: "UPS-3",
				location: "Plant Floor \u00B7 MCC Room",
				type: "Modular (N+1)",
				mode: "online",
				healthScore: 84,
				battery: {
					stringVoltage: 405.7,
					cellCount: 32,
					impedance: 4.2,
					impedanceBaseline: 3.9,
					temperature: 24.9,
					chargeCurrent: 1.4,
					capacityPct: 89,
					capacityHistory: genHistory(90, 24, 1.4, 78, 100),
					predictedReplacement: "Jun 2027"
				},
				runtime: { estimateMinutes: 21, requiredMinutes: 15 },
				load: {
					pct: 47, kw: 37.6, capacityKw: 80,
					trendHistory: genHistory(47, 24, 3, 30, 65)
				},
				electronics: {
					inverterVoltage: 406.1, inverterFrequency: 60.00, inverterThd: 1.4,
					rectifierStatus: "normal", capacitorHealthPct: 76, fanStatus: "normal"
				},
				environment: { ambientTempC: 25.6, humidityPct: 38, airQuality: "good", waterDetected: false },
				transfer: { switchStatus: "ready", bypassAvailable: true, lastTransferMs: 3, lastTransferAt: "Jul 14, 2026" },
				predictions: [
					{ label: "Module 3 capacitor bank", value: "\u22484 months", risk: "medium" },
					{ label: "Battery cabinet B replacement", value: "\u22489 months", risk: "low" },
					{ label: "Module-level load rebalance", value: "Nominal", risk: "low" }
				],
				alarms: [
					{ severity: "warning", message: "Module 3 capacitor bank trending toward end-of-life", time: "3 hrs ago", ack: false },
					{ severity: "info", message: "N+1 redundancy verified", time: "Today", ack: true }
				]
			}
		];
	}

	/* ---------------------------------------------------------------
	   boot: instantiate Ractive against the inline template script
	   --------------------------------------------------------------- */
	function formatClock() {
		return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
	}

	function boot() {
		var ractive = new Ractive({
			el: "#app",
			template: "#dashboard-template",

			data: {
				fleet: buildFleet(),
				activeIndex: 0,
				useFahrenheit: false,
				clockLabel: formatClock(),
				ringCircumference: round1(2 * Math.PI * 52),

				// helpers usable directly inside mustaches
				modeLabel: modeLabel,
				statusLabel: statusLabel,
				runtimeStatus: runtimeStatus,
				runtimeStatusLabel: runtimeStatusLabel,
				loadZone: loadZone,
				tempDisplay: tempDisplay,
				sparklinePoints: sparklinePoints,
				ringOffset: ringOffset,
				unacknowledgedCount: unacknowledgedCount
			},

			oninit: function () {
				var self = this;

				// `unit` is a live two-way link to the active fleet member,
				// so nested sets (e.g. unit.alarms.0.ack) write straight
				// back into fleet[activeIndex] without any extra plumbing.
				self.link("fleet.0", "unit");

				self.on("selectUnit", function (index) {
					self.set("activeIndex", index);
					self.link("fleet." + index, "unit");
				});

				self.on("ackAlarm", function (alarmIndex) {
					self.set("unit.alarms." + alarmIndex + ".ack", true);
				});

				self.on("simulateOutage", function () {
					var mode = self.get("unit.mode");
					var clock = formatClock();
					if (mode === "online") {
						self.set("unit.mode", "battery");
						self.unshift("unit.alarms", {
							severity: "critical",
							message: "Utility power lost \u2014 transferred to battery",
							time: clock,
							ack: false
						});
					} else {
						self.set("unit.mode", "online");
						self.set("unit.runtime.estimateMinutes", Math.max(self.get("unit.runtime.estimateMinutes"), 30));
						self.unshift("unit.alarms", {
							severity: "info",
							message: "Utility power restored",
							time: clock,
							ack: false
						});
					}
				});

				// clock, ticking every second
				self._clockTimer = setInterval(function () {
					self.set("clockLabel", formatClock());
				}, 1000);

				// telemetry jitter, ticking every few seconds — feels alive
				// without being distracting, and exercises Ractive's array
				// mutator shortcuts (push/shift) on every fleet member.
				self._telemetryTimer = setInterval(function () {
					var fleet = self.get("fleet");
					fleet.forEach(function (u, i) {
						var base = "fleet." + i + ".";

						var newCap = clamp(round1(u.battery.capacityPct + (Math.random() - 0.55) * 0.6), 60, 100);
						self.set(base + "battery.capacityPct", newCap);
						self.push(base + "battery.capacityHistory", newCap);
						if (self.get(base + "battery.capacityHistory").length > 24) {
							self.shift(base + "battery.capacityHistory");
						}

						var newTemp = clamp(round1(u.battery.temperature + (Math.random() - 0.5) * 0.4), 18, 40);
						self.set(base + "battery.temperature", newTemp);

						var loadDrift = (Math.random() - 0.5) * 4;
						var newLoad = clamp(round1(u.load.pct + loadDrift), 20, 98);
						self.set(base + "load.pct", newLoad);
						self.set(base + "load.kw", round1((newLoad / 100) * u.load.capacityKw));
						self.push(base + "load.trendHistory", newLoad);
						if (self.get(base + "load.trendHistory").length > 24) {
							self.shift(base + "load.trendHistory");
						}

						if (u.mode === "battery") {
							self.set(base + "runtime.estimateMinutes", Math.max(0, u.runtime.estimateMinutes - 1));
						}
					});
				}, 3000);
			},

			onteardown: function () {
				clearInterval(this._clockTimer);
				clearInterval(this._telemetryTimer);
			}
		});

		window.__upsFleetDashboard = ractive; // handy for console poking / debugging
	}

	document.addEventListener("DOMContentLoaded", boot);
})();
</script>

</body>
